name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  WEB_IMAGE: ghcr.io/${{ github.repository }}
  API_IMAGE: ghcr.io/${{ github.repository }}-api
  ML_IMAGE: ghcr.io/${{ github.repository }}-ml
  SEARCH_IMAGE: ghcr.io/${{ github.repository }}-search
  CHAT_IMAGE: ghcr.io/${{ github.repository }}-chat

jobs:
  # The API test suite runs against a synthetic dump with the real parquet schema.
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: api
          target: test
          load: true
          tags: dblp-api:test
          cache-from: type=gha,scope=api-test
          cache-to: type=gha,scope=api-test,mode=max
      - name: Run tests
        run: docker run --rm dblp-api:test

  # The ML pipeline's tests run against a synthetic serving database with planted signal, so they
  # check that the model learns and beats its baseline, not just that the code runs.
  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ml
          target: test
          load: true
          tags: dblp-ml:test
          cache-from: type=gha,scope=ml-test
          cache-to: type=gha,scope=ml-test,mode=max
      - name: Run tests
        run: docker run --rm dblp-ml:test

  # embed.py only imports torch/sentence-transformers inside a function, and tests inject a fake
  # encoder, so this test image never needs either - it stays fast even though the runtime image
  # below (which bakes the real model in) is large.
  test-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: search
          target: test
          load: true
          tags: dblp-search:test
          cache-from: type=gha,scope=search-test
          cache-to: type=gha,scope=search-test,mode=max
      - name: Run tests
        run: docker run --rm dblp-search:test

  # The assistant's tools run against a synthetic dump whose answers are written down, and the agent
  # loop runs against a scripted model client - so no API key and no network are needed here.
  test-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: chat
          target: test
          load: true
          tags: dblp-chat:test
          cache-from: type=gha,scope=chat-test
          cache-to: type=gha,scope=chat-test,mode=max
      - name: Run tests
        run: docker run --rm dblp-chat:test

  # Every push and PR: prove the images build. On main, also push them to GHCR.
  build:
    needs: [test-api, test-ml, test-search, test-chat]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            context: .
            target: ""
            image_env: WEB_IMAGE
          - name: api
            context: api
            target: runtime
            image_env: API_IMAGE
          - name: ml
            context: ml
            target: runtime
            image_env: ML_IMAGE
          - name: search
            context: search
            target: runtime
            image_env: SEARCH_IMAGE
          - name: chat
            context: chat
            target: runtime
            image_env: CHAT_IMAGE
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.name }} image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env[matrix.image_env] }}:latest
            ${{ env[matrix.image_env] }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Main only: ssh into the VM, pull the new images, restart the stack.
  # Skips cleanly (no failure) until the VM_HOST secret exists.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-vm
    permissions:
      contents: read
      packages: read
    env:
      HAS_HOST: ${{ secrets.VM_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Not configured yet
        if: env.HAS_HOST != 'true'
        run: echo "VM_HOST secret is not set - skipping deploy. Build succeeded and the images are on GHCR."

      - name: Prepare SSH
        if: env.HAS_HOST == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose file to the VM
        if: env.HAS_HOST == 'true'
        run: |
          # both bind-mount directories must exist and be owned by the deploying user: Docker would
          # otherwise create them as root, and the containers run as that user
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'mkdir -p ~/dblp-dashboard/cache ~/dblp-dashboard/models'
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/dblp-dashboard/docker-compose.prod.yml"

      - name: Pull and restart on the VM
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
            set -e
            cd ~/dblp-dashboard
            # first deploy: point the api at the analysis folder, running as its owner
            if [ ! -f .env ]; then
              {
                echo "DBLP_DIR=$HOME/dblp"
                echo "DATA_UID=$(id -u)"
                echo "DATA_GID=$(id -g)"
              } > .env
            fi
            # the assistant's secrets: written when the repo has them, otherwise whatever is
            # already in .env is left alone (so a hand-edited key survives a deploy)
            set_env() {
              [ -n "$2" ] || return 0
              grep -v "^$1=" .env > .env.next || true
              echo "$1=$2" >> .env.next
              mv .env.next .env
            }
            set_env OPENAI_API_KEY '${{ secrets.OPENAI_API_KEY }}'
            set_env CHAT_TOKEN '${{ secrets.CHAT_TOKEN }}'
            chmod 600 .env
            test -f "$(grep '^DBLP_DIR=' .env | cut -d= -f2)/parquet/dblp.parquet" \
              || { echo "dblp.parquet not found under DBLP_DIR in ~/dblp-dashboard/.env"; exit 1; }
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # --profile ml/search also pulls the batch-job images, so running one later needs no
            # registry credentials on the VM (the packages are private); `up` without the profiles
            # still starts web, api, mlapi and searchapi
            docker compose -f docker-compose.prod.yml --profile ml --profile search --profile chat pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f >/dev/null
            docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Smoke test
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
            set -e
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:8081/ && curl -fsS http://127.0.0.1:8081/api/health \
                 && curl -fsS http://127.0.0.1:8081/api/ml/health && curl -fsS http://127.0.0.1:8081/api/search/health \
                 && curl -fsS http://127.0.0.1:8081/api/chat/health; then
                echo; echo "dashboard, api, both model servers and the assistant are up"; exit 0
              fi
              sleep 2
            done
            echo "dashboard did not come up"; docker logs --tail 50 dblp-api; exit 1
          EOF
