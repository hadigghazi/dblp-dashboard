name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  WEB_IMAGE: ghcr.io/${{ github.repository }}
  API_IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  # The API test suite runs against a synthetic dump with the real parquet schema.
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: api
          target: test
          load: true
          tags: dblp-api:test
          cache-from: type=gha,scope=api-test
          cache-to: type=gha,scope=api-test,mode=max
      - name: Run tests
        run: docker run --rm dblp-api:test

  # Every push and PR: prove both images build. On main, also push them to GHCR.
  build:
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            context: .
            target: ""
            image_env: WEB_IMAGE
          - name: api
            context: api
            target: runtime
            image_env: API_IMAGE
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.name }} image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env[matrix.image_env] }}:latest
            ${{ env[matrix.image_env] }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Main only: ssh into the VM, pull the new images, restart the stack.
  # Skips cleanly (no failure) until the VM_HOST secret exists.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-vm
    permissions:
      contents: read
      packages: read
    env:
      HAS_HOST: ${{ secrets.VM_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Not configured yet
        if: env.HAS_HOST != 'true'
        run: echo "VM_HOST secret is not set - skipping deploy. Build succeeded and the images are on GHCR."

      - name: Prepare SSH
        if: env.HAS_HOST == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose file to the VM
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'mkdir -p ~/dblp-dashboard/cache'
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/dblp-dashboard/docker-compose.prod.yml"

      - name: Pull and restart on the VM
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
            set -e
            cd ~/dblp-dashboard
            # first deploy: point the api at the analysis folder, running as its owner
            if [ ! -f .env ]; then
              {
                echo "DBLP_DIR=$HOME/dblp"
                echo "DATA_UID=$(id -u)"
                echo "DATA_GID=$(id -g)"
              } > .env
            fi
            test -f "$(grep '^DBLP_DIR=' .env | cut -d= -f2)/parquet/dblp.parquet" \
              || { echo "dblp.parquet not found under DBLP_DIR in ~/dblp-dashboard/.env"; exit 1; }
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f >/dev/null
            docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Smoke test
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
            set -e
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:8081/ && curl -fsS http://127.0.0.1:8081/api/health; then
                echo; echo "dashboard and api are up"; exit 0
              fi
              sleep 2
            done
            echo "dashboard did not come up"; docker logs --tail 50 dblp-api; exit 1
          EOF
