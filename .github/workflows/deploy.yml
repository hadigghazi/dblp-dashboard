name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Every push and PR: prove the image builds. On main, also push it to GHCR.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Main only: ssh into the VM, pull the new image, restart the container.
  # Skips cleanly (no failure) until the VM_HOST secret exists.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HAS_HOST: ${{ secrets.VM_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Not configured yet
        if: env.HAS_HOST != 'true'
        run: echo "VM_HOST secret is not set - skipping deploy. Build succeeded and the image is on GHCR."

      - name: Prepare SSH
        if: env.HAS_HOST == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose file to the VM
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'mkdir -p ~/dblp-dashboard'
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/dblp-dashboard/docker-compose.prod.yml"

      - name: Pull and restart on the VM
        if: env.HAS_HOST == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
            set -e
            cd ~/dblp-dashboard
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker logout ghcr.io
            docker image prune -f >/dev/null
            echo "deployed: $(docker inspect --format='{{.Image}}' dblp-dashboard)"
          EOF

      - name: Smoke test
        if: env.HAS_HOST == 'true'
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ secrets.VM_HOST }}/")
          echo "http://${{ secrets.VM_HOST }}/ -> HTTP $code"
          test "$code" = "200"
