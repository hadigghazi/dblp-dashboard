# Used on the VM. Pulls the images GitHub Actions built; nothing is built on the server.
#   docker compose -f docker-compose.prod.yml up -d
# .env (written by the deploy job on first run):
#   DBLP_DIR=/home/<user>/dblp     the analysis folder: parquet/, eda_out/, charts/
#   DATA_UID / DATA_GID            the owner of that folder; the api runs as this user
services:
  api:
    image: ghcr.io/hadigghazi/dblp-dashboard-api:latest
    container_name: dblp-api
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    environment:
      # the VM (8 vCPU, 31 GB) also runs AutoML Studio and the search app: leave them room
      DUCKDB_MEMORY: ${DUCKDB_MEMORY:-10GB}
      DUCKDB_THREADS: ${DUCKDB_THREADS:-4}
      HOME: /cache
    volumes:
      - ${DBLP_DIR:?set DBLP_DIR in .env}:/data:ro   # read-only: the api never writes to your data
      - ./cache:/cache                               # its own serving database (a few GB)
    restart: unless-stopped

  web:
    image: ghcr.io/hadigghazi/dblp-dashboard:latest
    container_name: dblp-dashboard
    ports:
      - "127.0.0.1:8081:80"   # Caddy on the VM owns :80/:443 and forwards the catch-all here
    volumes:
      # the published dataset, and nothing else from models/: `ml.network.cli publish` fills it
      - ./models/downloads:/usr/share/nginx/downloads:ro
    depends_on: [api, mlapi, searchapi, chatapi]
    restart: unless-stopped

  # The model server behind /api/ml/ (same image as the batch job below).
  mlapi:
    image: ghcr.io/hadigghazi/dblp-dashboard-ml:latest
    container_name: dblp-mlapi
    command: ["uvicorn", "ml.server:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    environment:
      DUCKDB_MEMORY: ${ML_DUCKDB_MEMORY:-4GB}
      DUCKDB_THREADS: ${ML_DUCKDB_THREADS:-4}
      ML_TMP_DIR: /tmp/duckdb
    volumes:
      - ${DBLP_DIR:?set DBLP_DIR in .env}:/data:ro
      - ./cache:/cache:ro
      - ./models:/models      # reads the trained model; writes cached suggestions
    restart: unless-stopped

  # Batch ML jobs. Runs only when asked:
  #   docker compose -f docker-compose.prod.yml run --rm ml python -m ml.cli train
  ml:
    image: ghcr.io/hadigghazi/dblp-dashboard-ml:latest
    pull_policy: missing        # the deploy job pulls it; `run` must not need a registry login
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    environment:
      DUCKDB_MEMORY: ${ML_DUCKDB_MEMORY:-8GB}
      DUCKDB_THREADS: ${ML_DUCKDB_THREADS:-4}
    volumes:
      - ${DBLP_DIR:?set DBLP_DIR in .env}:/data:ro
      - ./cache:/cache:ro     # the api's serving tables, read-only
      - ./models:/models      # model artifacts + metrics
    profiles: ["ml"]

  # The hybrid-search server behind /api/search/ (same image as the batch jobs below). The model
  # is baked into the image, so this never needs internet access.
  searchapi:
    image: ghcr.io/hadigghazi/dblp-dashboard-search:latest
    container_name: dblp-searchapi
    command: ["uvicorn", "search.server:app", "--host", "0.0.0.0", "--port", "8003", "--workers", "1"]
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    environment:
      DUCKDB_MEMORY: ${SEARCH_DUCKDB_MEMORY:-3GB}
      DUCKDB_THREADS: ${SEARCH_DUCKDB_THREADS:-2}
      SEARCH_TMP_DIR: /tmp/duckdb
      # only needed when SEARCH_MODEL names an API model, or to run a pilot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEARCH_MODEL: ${SEARCH_MODEL:-BAAI/bge-small-en-v1.5}
      SEARCH_EMBED_DIM: ${SEARCH_EMBED_DIM:-384}
    volumes:
      - ${DBLP_DIR:?set DBLP_DIR in .env}:/data:ro
      - ./cache:/cache:ro
      - ./models:/models      # search store, embedding vectors, progress, evaluation, cache
    restart: unless-stopped

  # Batch search jobs (the sparse index, and the - slow, resumable - embedding build). Not started
  # by `up -d`:
  #   docker compose -f docker-compose.prod.yml run --rm search python -m search.cli store
  #   docker compose -f docker-compose.prod.yml run -d --name search-embed search python -m search.cli build-index
  search:
    image: ghcr.io/hadigghazi/dblp-dashboard-search:latest
    pull_policy: missing
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    environment:
      DUCKDB_MEMORY: ${SEARCH_DUCKDB_MEMORY:-6GB}
      DUCKDB_THREADS: ${SEARCH_DUCKDB_THREADS:-8}
      SEARCH_ENCODE_THREADS: ${SEARCH_ENCODE_THREADS:-8}
      # only needed when SEARCH_MODEL names an API model, or to run a pilot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEARCH_MODEL: ${SEARCH_MODEL:-BAAI/bge-small-en-v1.5}
      SEARCH_EMBED_DIM: ${SEARCH_EMBED_DIM:-384}
    volumes:
      - ${DBLP_DIR:?set DBLP_DIR in .env}:/data:ro
      - ./cache:/cache:ro
      - ./models:/models
    profiles: ["search"]

  # The assistant behind /api/chat/. It reads the api's serving tables, keeps a small leaderboard
  # store of its own, and calls an OpenAI-compatible endpoint - so it is the only container that
  # needs outbound internet and an API key. Without OPENAI_API_KEY it starts and reports
  # "not configured" rather than failing.
  chatapi:
    image: ghcr.io/hadigghazi/dblp-dashboard-chat:latest
    container_name: dblp-chatapi
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL_FAST: ${CHAT_MODEL_FAST:-gpt-4.1-mini}
      CHAT_MODEL_DEEP: ${CHAT_MODEL_DEEP:-gpt-4.1}
      CHAT_TOKEN: ${CHAT_TOKEN:-}                      # unset = open; set = the page asks for it
      CHAT_BUDGET_USD_PER_DAY: ${CHAT_BUDGET_USD_PER_DAY:-2.00}
      CHAT_RATE_PER_MINUTE: ${CHAT_RATE_PER_MINUTE:-6}
      CHAT_RATE_PER_DAY: ${CHAT_RATE_PER_DAY:-200}
      # the abstract search (questions about what papers say): OpenAlex's free key, and a daily cap on
      # its calls that keeps within that key's allowance
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      CHAT_OPENALEX_CALLS_PER_DAY: ${CHAT_OPENALEX_CALLS_PER_DAY:-1400}
      DUCKDB_MEMORY: ${CHAT_DUCKDB_MEMORY:-2GB}
      DUCKDB_THREADS: ${CHAT_DUCKDB_THREADS:-2}
      CHAT_TMP_DIR: /tmp/duckdb
    volumes:
      - ${DBLP_DIR:?set DBLP_DIR in .env}:/data:ro   # `src` is a view over the parquet, so it must be reachable
      - ./cache:/cache:ro     # the api's serving tables, read-only
      - ./models:/models      # its leaderboard store, answer cache, spend ledger, gold-set report
    restart: unless-stopped

  # The same image as a batch job, for the terminal:
  #   docker compose -f docker-compose.prod.yml run --rm chat python -m chat.cli ask "who has most papers?"
  #   docker compose -f docker-compose.prod.yml run --rm chat python -m chat.cli evaluate
  chat:
    image: ghcr.io/hadigghazi/dblp-dashboard-chat:latest
    pull_policy: missing
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL_FAST: ${CHAT_MODEL_FAST:-gpt-4.1-mini}
      CHAT_MODEL_DEEP: ${CHAT_MODEL_DEEP:-gpt-4.1}
      DUCKDB_MEMORY: ${CHAT_DUCKDB_MEMORY:-4GB}
      DUCKDB_THREADS: ${CHAT_DUCKDB_THREADS:-4}
      CHAT_TMP_DIR: /tmp/duckdb
      # optional, free: lifts OpenAlex's keyless budget (~100 searches a day) for `dblpqa retrieval`
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      # the defaults (searchapi:8003, mlapi:8001) resolve on this compose network, so a question
      # asked from the terminal reaches the same services the web endpoint uses
    volumes:
      - ${DBLP_DIR:?set DBLP_DIR in .env}:/data:ro   # `src` is a view over the parquet, so it must be reachable
      - ./cache:/cache:ro
      - ./models:/models
    profiles: ["chat"]
