server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Live data: forwarded to the api container. Resolved per request through Docker's DNS,
    # so nginx starts even while the api is still coming up.
    resolver 127.0.0.11 valid=30s ipv6=off;
    # The disambiguation model server (same stack, separate container). Predictions can take
    # tens of seconds on a large bin the first time; afterwards they are cached.
    location /api/ml/ {
        set $ml_upstream http://mlapi:8001;
        rewrite ^/api/ml/(.*)$ /ml/$1 break;   # with a variable upstream, proxy_pass must carry no URI
        proxy_pass $ml_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
    # Hybrid paper search. A dense query is a full pass over the embedding index; uncached, it can
    # take a couple of seconds.
    location /api/search/ {
        set $search_upstream http://searchapi:8003;
        rewrite ^/api/search/(.*)$ /search/$1 break;
        proxy_pass $search_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    # The assistant. Answers are server-sent events, so buffering must be off - otherwise nginx
    # holds the whole stream and the page shows nothing until the end.
    location /api/chat/ {
        set $chat_upstream http://chatapi:8004;
        rewrite ^/api/chat/(.*)$ /chat/$1 break;
        proxy_pass $chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 120s;
    }
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # a cold query over the full dump can take a while
        proxy_buffering on;
    }

    # The published dataset. Served by nginx itself so a 500 MB download is resumable (range
    # requests) and never passes through Python. Only this one folder is mounted, read-only; the rest
    # of the models directory - logs, model files - is not reachable. A missing file is a plain 404,
    # not the app shell, so the page can tell "not published yet" apart from an error.
    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
        # datasheets and the checksum list read in the browser; the .gz files download
        # this block replaces the whole MIME map here, so everything served as text is listed
        types { text/html html; text/plain md txt; application/json json; }
        default_type application/octet-stream;
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # Hashed build assets can be cached for a long time; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Single-page app: any unknown path falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
